{% extends "base.html" %}
{% block title %}Operadores{% endblock %}
{% block content %}
  <h1>Operadores</h1>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Usuário</th><th>Nome</th><th>Admin</th><th>Criado em</th></tr></thead>
      <tbody>
        {% for o in operadores %}
          <tr>
            <td class="mono">{{ o.username }}</td>
            <td>{{ o.display_name }}</td>
            <td>{{ "Sim" if o.is_admin else "—" }}</td>
            <td class="mono">{{ o.created_at }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-title">Novo operador</div>
    <form method="post" action="{{ url_for('admin_operador_novo') }}" class="form">
      <div class="field">
        <label for="username">Usuário (usado também na coluna de operador do CSV do Orbit)</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="field">
        <label for="display_name">Nome de exibição</label>
        <input type="text" id="display_name" name="display_name">
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="field">
        <label><input type="checkbox" name="is_admin"> É administrador (pode importar o CSV do Orbit)</label>
      </div>
      <button type="submit" class="btn btn-primary">Criar operador</button>
    </form>
  </div>
{% endblock %}
