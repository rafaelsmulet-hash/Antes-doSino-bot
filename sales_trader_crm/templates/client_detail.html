{% extends "base.html" %}
{% block title %}{{ client['name'] }}{% endblock %}
{% block content %}
  <h1>{{ client['name'] }}</h1>

  <section class="card">
    <h2>Estruturas ativas</h2>
    <p class="pre">{{ client['structures'] or "—" }}</p>
    <h2>Observações</h2>
    <p class="pre">{{ client['notes'] or "—" }}</p>
  </section>

  <div class="actions">
    <a href="{{ url_for('edit_client', client_id=client['id']) }}" class="btn">Editar</a>
    <form method="post" action="{{ url_for('delete_client', client_id=client['id']) }}"
          onsubmit="return confirm('Excluir este cliente e todo o histórico dele?');" style="display:inline">
      <button type="submit" class="btn btn-danger">Excluir</button>
    </form>
    <a href="{{ url_for('index') }}" class="btn">Voltar</a>
  </div>
{% endblock %}
