{% extends "base.html" %}
{% block title %}{{ "Editar cliente" if client else "Novo cliente" }}{% endblock %}
{% block content %}
  <h1>{{ "Editar cliente" if client else "Novo cliente" }}</h1>
  <form method="post" class="form">
    <label>
      Nome
      <input type="text" name="name" value="{{ form.name if form.name else (client['name'] if client else '') }}" required>
    </label>
    <label>
      Estrutura(s) de derivativos ativa(s)
      <textarea name="structures" rows="3" placeholder="Ex: Collar USD 12/2026, Trava de alta IBOV...">{{ form.structures if form.structures else (client['structures'] if client else '') }}</textarea>
    </label>
    <label>
      Observações gerais
      <textarea name="notes" rows="3">{{ form.notes if form.notes else (client['notes'] if client else '') }}</textarea>
    </label>
    {% if not client %}
      <label>
        Data do último contato
        <input type="date" name="last_contact_date" value="{{ today }}" required>
      </label>
    {% endif %}
    <div class="actions">
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a href="{{ url_for('index') }}" class="btn">Cancelar</a>
    </div>
  </form>
{% endblock %}
