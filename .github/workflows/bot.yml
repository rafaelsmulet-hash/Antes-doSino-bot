name: Antes do Sino - Bot de Noticias

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Serializa as execucoes do bot: o disparo externo roda a cada poucos
# minutos, mas uma execucao pode demorar mais que isso (FFmpeg, chamadas
# de IA, geracao de arte). Sem essa trava, duas execucoes rodavam em
# paralelo sobre o MESMO checkout (mesmo social_queue.json, mesmo offset
# do Telegram, mesmos estados de opening/midday/closing/breaking) e a
# que dava push por ultimo sobrescrevia o trabalho da outra - inclusive
# itens ja aprovados, causando o loop de "ID nao encontrado" +
# reenvio duplicado de conteudo para aprovacao. cancel-in-progress:false
# enfileira a proxima chamada em vez de cancelar a que esta rodando.
concurrency:
  group: antes-do-sino-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Rodar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python main.py


      - name: Salvar historico (sent_items.json)
        run: |
          git config --global user.name "antes-do-sino-bot"
          git config --global user.email "bot@antesdosino.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Atualiza historico de noticias e portal"
            # Com a fila de concorrencia acima, este pull normalmente e um
            # fast-forward (nao ha commits divergentes). Se ainda assim
            # houver conflito, NAO usamos "-X ours": isso descartava em
            # silencio o lado remoto (podendo apagar item ja aprovado ou
            # o offset do Telegram ja avancado). Preferimos falhar o job
            # e deixar a proxima execucao tentar de novo com estado
            # integro, em vez de corromper o historico silenciosamente.
            git pull --rebase origin main
            git push origin main
          else
            echo "Nenhuma alteracao para salvar."
          fi
