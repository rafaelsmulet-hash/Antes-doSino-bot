name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: false -> deploys novos ENTRAM NA FILA em vez de
# cancelar o deploy em andamento. O modo antigo (Pages "Deploy from a
# branch") cancela o build anterior a cada push novo; como o bot commita
# a cada poucos minutos, nenhum deploy chegava a terminar. Com fila, todo
# commit acaba sendo publicado, mesmo que com alguns minutos de atraso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
