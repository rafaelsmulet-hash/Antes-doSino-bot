name: Teste - Gerar Sino

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test-bell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pillow cairosvg

      - name: Rodar teste do sino
        run: python test_bell.py

      - name: Salvar imagem de teste
        run: |
          git config --global user.name "antes-do-sino-bot"
          git config --global user.email "bot@antesdosino.local"
          git add docs/test-bell.png
          git commit -m "Adiciona imagem de teste do sino" || echo "Nada para commitar"
          git pull origin main --no-rebase -X ours
          git push origin main
